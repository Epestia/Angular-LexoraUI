<h2>Flashcards</h2>

@if (loading) {
  <p>Chargement...</p>
}

@if (errorMessage) {
  <p>{{ errorMessage }}</p>
}

@for (flashcard of flashcards; track flashcard.id) {
  <div class="flashcard">
    <h3>{{ flashcard.frontText }}</h3>
    <p>{{ flashcard.backText }}</p>

    <button (click)="deleteFlashcard(flashcard.id!)">
      Supprimer
    </button>
  </div>
}

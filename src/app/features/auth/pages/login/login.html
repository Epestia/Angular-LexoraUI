<div class="flex justify-content-center mt-6">

  <p-card header="Connexion" styleClass="w-25rem">

    @if (successMessage) {
      <p-message
        severity="success"
        [text]="successMessage"
        styleClass="mb-3 w-full">
      </p-message>
    }

    @if (errorMessage) {
      <p-message
        severity="error"
        [text]="errorMessage"
        styleClass="mb-3 w-full">
      </p-message>
    }

    <div class="flex flex-column gap-3">

      <span class="p-float-label">
        <input
          pInputText
          id="username"
          [(ngModel)]="username"
          class="w-full">
        <label for="username">Nom d'utilisateur</label>
      </span>

      <span class="p-float-label">
        <p-password
          id="password"
          [(ngModel)]="password"
          [feedback]="false"
          [toggleMask]="true"
          styleClass="w-full"
          inputStyleClass="w-full">
        </p-password>
        <label for="password">Mot de passe</label>
      </span>

      <button
        pButton
        type="button"
        label="Se connecter"
        icon="pi pi-sign-in"
        class="w-full"
        (click)="login()">
      </button>

    </div>

  </p-card>

</div>

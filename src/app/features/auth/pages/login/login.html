<div class="login-container">

  <p-card class="login-card">

    <div class="text-center mb-5">
      <i class="pi pi-user text-6xl text-primary"></i>
      <h2 class="mt-3 mb-1">Connexion</h2>
      <p class="text-color-secondary">
        Connectez-vous à votre compte
      </p>
    </div>

    @if (successMessage) {
      <p-message severity="success" class="w-full mb-3">
        {{ successMessage }}
      </p-message>
    }

    @if (errorMessage) {
      <p-message severity="error" class="w-full mb-3">
        {{ errorMessage }}
      </p-message>
    }

    <div class="flex flex-column gap-4">

      <p-floatlabel class="w-full">
        <input
          pInputText
          id="username"
          [(ngModel)]="username"
          class="w-full" />

        <label for="username">
          <i class="pi pi-user mr-2"></i>
          Nom d'utilisateur
        </label>
      </p-floatlabel>

      <p-floatlabel class="w-full password-field">
        <p-password
          inputId="password"
          [(ngModel)]="password"
          [feedback]="false"
          [toggleMask]="true"
          inputStyleClass="w-full">
        </p-password>

        <label for="password">
          <i class="pi pi-lock mr-2"></i>
          Mot de passe
        </label>
      </p-floatlabel>

      <button
        pButton
        type="button"
        class="w-full login-btn"
        (click)="login()">

        <i class="pi pi-sign-in"></i>
        <span class="ml-2">Se connecter</span>

      </button>

    </div>

  </p-card>

</div>

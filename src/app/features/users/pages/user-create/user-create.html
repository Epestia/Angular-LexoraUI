<div class="container">

  <h2>Créer un utilisateur</h2>

  @if (successMessage) {
    <div class="success">
      {{ successMessage }}
    </div>
  }

  @if (errorMessage) {
    <div class="error">
      {{ errorMessage }}
    </div>
  }

  <div class="form">

    <input
      type="text"
      placeholder="Username"
      [(ngModel)]="username"
      name="username"
    >

    <input
      type="password"
      placeholder="Password"
      [(ngModel)]="password"
      name="password"
    >

    <button (click)="createUser()">
      Créer utilisateur
    </button>

  </div>

</div>

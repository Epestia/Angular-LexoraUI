<div class="deck-container">

  @for (deck of decks(); track deck.id ?? $index) {

    <p-card class="deck-card">

      <ng-template pTemplate="header">
        <div class="deck-header">
          <h2>{{ deck.title }}</h2>

          <p-tag
            [value]="deck.status"
            [severity]="getStatusSeverity(deck.status)">
          </p-tag>
        </div>
      </ng-template>

      <div class="deck-meta">
        <span>{{ deck.language }}</span>
        <span>{{ getFlashcards(deck.id).length }} flashcards</span>
      </div>

      <!-- FLASHCARDS -->
      <div class="flashcards">

        @for (flashcard of getFlashcards(deck.id); track flashcard.id ?? $index) {

          <div class="flashcard">

            <div class="front">
              {{ flashcard.frontText }}
            </div>

            <div class="flip-icon">
              ↺
            </div>

            <div class="back">
              {{ flashcard.backText }}
            </div>

            <!-- FLASHCARD ACTIONS -->
            <div class="flashcard-actions">

              <p-button
                icon="pi pi-language"
                severity="help"
                label="Translations"
                [routerLink]="['/flashcards', flashcard.id, 'translations']">
              </p-button>

            </div>

          </div>

        }

      </div>

      <!-- ACTIONS DECK -->
      <div class="actions">

        <p-button
          icon="pi pi-pencil"
          severity="info"
          label="Edit"
          [routerLink]="['/decks/edit', deck.id]">
        </p-button>

        <p-button
          icon="pi pi-trash"
          severity="danger"
          label="Supprimer"
          (click)="deleteDeck(deck.id!)">
        </p-button>

        <p-button
          icon="pi pi-plus"
          severity="success"
          label="Créer flashcard"
          [routerLink]="['/decks', deck.id, 'flashcards', 'create']">
        </p-button>


      </div>

    </p-card>

  }

</div>

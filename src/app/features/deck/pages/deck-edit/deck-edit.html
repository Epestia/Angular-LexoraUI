<form [formGroup]="deckForm" (ngSubmit)="onSubmit()">

  <input formControlName="title" placeholder="Titre">
  <input formControlName="language" placeholder="Langue">

  <label>
    Public
    <input type="checkbox" formControlName="isPublic">
  </label>

  <select formControlName="status">
    <option value="PRIVATE">PRIVATE</option>
    <option value="PENDING_VALIDATION">PENDING VALIDATION</option>
    <option value="APPROVED">APPROVED</option>
  </select>

  @if (authService.isAdmin()) {
    <input formControlName="validatedById" placeholder="Validator ID">
    <input formControlName="validationDate" type="date">
  }

  <button type="submit">Sauvegarder</button>

</form>

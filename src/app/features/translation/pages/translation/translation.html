<div class="container">

  <p-card header="Translations">

    <div class="mb-3">
      <p-button
        label="Créer une traduction"
        icon="pi pi-plus"
        (click)="goToCreate()">
      </p-button>
    </div>

    @if (translations().length === 0) {
      <p>Aucune traduction trouvée</p>
    } @else {

      <p-table [value]="translations()" [tableStyle]="{ 'min-width': '60rem' }">

        <ng-template pTemplate="header">
          <tr>
            <th>Texte traduit</th>
            <th>Langue</th>
            <th>Flashcard</th>
            <th>Actions</th>
          </tr>
        </ng-template>

        <ng-template pTemplate="body" let-t>
          <tr>
            <td>{{ t.translatedText }}</td>
            <td>{{ t.learnerLanguage }}</td>
            <td>{{ t.flashcardId }}</td>

            <td>
              <p-button
                icon="pi pi-trash"
                severity="danger"
                size="small"
                (click)="deleteTranslation(t.id!)">
              </p-button>
            </td>
          </tr>
        </ng-template>

      </p-table>

    }

  </p-card>

</div>

<p-menubar [model]="items">

  <ng-template pTemplate="start">
    <a class="logo" routerLink="/">
      Lexora
    </a>
  </ng-template>

  <ng-template pTemplate="end">

    @if (!user()) {

      <button
        pButton
        label="Créer un compte"
        icon="pi pi-user-plus"
        class="p-button-secondary"
        (click)="goToRegister()">
      </button>

      <button
        pButton
        label="Connexion"
        icon="pi pi-sign-in"
        (click)="goToLogin()">
      </button>

    }

    @if (user()) {

      <span class="user">
        {{ user()?.sub }}
      </span>

      <button
        pButton
        icon="pi pi-sign-out"
        severity="danger"
        label="Déconnexion"
        (click)="logout()">
      </button>
    }

  </ng-template>

</p-menubar>

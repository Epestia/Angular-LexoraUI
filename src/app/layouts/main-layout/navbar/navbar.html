<nav class="navbar">

  <div class="logo">
    <a routerLink="/">Mon Application</a>
  </div>

  <ul class="nav-links">
    <li>
      <a routerLink="/">Accueil</a>
    </li>

    <li>
      @if (!user()) {
        <a routerLink="/users/create">
          Créer utilisateur
        </a>
      }
    </li>

    @if (user() && user()?.role === 'ADMIN') {
      <li class="dropdown">
        <a class="dropbtn">
          Gestion utilisateur ▼
        </a>

        <ul class="dropdown-content">

          <li>
            <a routerLink="/users">
              User List
            </a>
          </li>

          <li>
            <a routerLink="/roles">
              Gestion rôles
            </a>
          </li>

        </ul>
      </li>
    }
  </ul>

  <div class="actions">

    @if (!user()) {
      <a routerLink="/login" class="btn">
        Connexion
      </a>
    }

    @if (user()) {
      <div class="user-info">
        Bonjour {{ user()?.sub }}
      </div>

      <button (click)="logout()">
        Logout
      </button>
    }

  </div>

</nav>
